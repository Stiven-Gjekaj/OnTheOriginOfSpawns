# This workflow builds the wiki data from the mod files and publishes website/ to GitHub Pages.

name: pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/main/resources/**'
      - 'design/**'
      - 'docs/**'
      - 'README.md'
      - 'gradle.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push does not stop a deployment that runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: build the wiki data
        run: node website/build.mjs
      - name: configure pages
        uses: actions/configure-pages@v6
      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to pages
        id: deployment
        uses: actions/deploy-pages@v5
