# This workflow builds the Astro wiki in website/ from the mod files and publishes it to GitHub Pages.

name: pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/main/resources/**'
      - 'design/**'
      - 'docs/**'
      - 'README.md'
      - 'gradle.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push does not stop a deployment that runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: check the node version
        # Astro 7 needs Node 22.12 or later.
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (a < 22 || (a === 22 && b < 12)) { console.error("Node " + process.versions.node + " is too old. Astro needs Node 22.12 or later."); process.exit(1); }'
      - name: install the dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: build the wiki
        # The build script runs build.mjs first, which reads the mod files.
        working-directory: website
        run: npm run build
      - name: configure pages
        uses: actions/configure-pages@v6
      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to pages
        id: deployment
        uses: actions/deploy-pages@v5
