# This workflow updates the Modrinth page from the files in this repository.
# It sets the description from docs/store-description.md, and adds the pictures
# in assets/gallery to the gallery. A picture that is already in the gallery,
# with the same title, is not added again. With the input "replace", the workflow
# deletes that picture and adds the new file in its place.
# Start it by hand from the Actions tab.

name: store-pages
on:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the gallery pictures that are already there
        type: boolean
        default: false

jobs:
  modrinth:
    runs-on: ubuntu-24.04
    env:
      PROJECT: tvKIdALe
      API: https://api.modrinth.com/v2
      RAW_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      AGENT: Stiven-Gjekaj/OnTheOriginOfSpawns (store-pages workflow)
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: clean the token
        # The stored token can end with a space or a new line, which the API refuses.
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "The token has ${#token} characters."
          echo "TOKEN=$token" >> "$GITHUB_ENV"
      - name: set the description
        run: |
          jq -n --rawfile body docs/store-description.md '{body: $body}' > body.json
          curl --fail-with-body -sS -X PATCH "$API/project/$PROJECT" \
            -H "Authorization: $TOKEN" -H "User-Agent: $AGENT" -H "Content-Type: application/json" \
            --data @body.json
      - name: add the gallery pictures
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          gallery=$(curl --fail-with-body -sS "$API/project/$PROJECT" \
            -H "Authorization: $TOKEN" -H "User-Agent: $AGENT" | jq -c '.gallery')
          echo "The gallery has these pictures:"
          printf '%s' "$gallery" | jq -r '.[] | "- " + (.title // "no title") + ": " + .url'
          add() {
            file="$1"; title="$2"; description="$3"; featured="$4"
            url=$(printf '%s' "$gallery" | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].url // empty')
            if [ -n "$url" ]; then
              if [ "$REPLACE" != "true" ]; then
                echo "The gallery already has: $title"
                return
              fi
              echo "The old picture of $title is at: $url"
              curl --fail-with-body -sS -X DELETE "$API/project/$PROJECT/gallery" \
                --url-query "url=$url" -H "Authorization: $TOKEN" -H "User-Agent: $AGENT"
              echo "Deleted the old picture: $title"
            fi
            echo "Add: $title"
            # The fields go in the URL and the picture is the body, so the request does not use -G.
            curl --fail-with-body -sS -X POST "$API/project/$PROJECT/gallery" \
              --url-query "ext=png" --url-query "featured=$featured" \
              --url-query "title=$title" --url-query "description=$description" \
              -H "Authorization: $TOKEN" -H "User-Agent: $AGENT" -H "Content-Type: image/png" \
              --data-binary "@$file"
            echo "Added: $title"
          }
          add assets/gallery/zombies.png "Zombies" "Predators, Stalkers, Tanks, Hordes, and Blights, each with three genes" true
          add assets/gallery/husks.png "Husks" "Scorchers, Dunecrawlers, Mummies, Caravans, and Parchers, each with three genes" false
          add assets/gallery/drowned.png "Drowned" "Riptides, Harpooners, Abyssals, Barnacled, and Sirens, each with three genes" false
          add assets/gallery/skeletons.png "Skeletons" "Marksmen, Rattlers, Ossified, Legions, and Hexers, each with three genes" false
          add assets/gallery/strays.png "Strays" "Glaciers, Blizzards, Drifters, Frostbiters, and Wailers, each with three genes" false
          add assets/gallery/bogged.png "Bogged" "Sporecaps, Mirefolk, Venomers, Vinebound, and Mosshides, each with three genes" false
          add assets/gallery/wither_skeletons.png "Wither skeletons" "Blademasters, Ashborn, Witherlords, Ramparts, and Soul Reapers, each with three genes" false
          add assets/gallery/parched.png "Parched" "Enfeeblers, Windcarvers, Vultures, Scorpions, and Fossils, each with three genes" false
          add assets/gallery/info_panel.png "Mob info panel" "The panel shows what you know of the family and the genes of a mob" false
